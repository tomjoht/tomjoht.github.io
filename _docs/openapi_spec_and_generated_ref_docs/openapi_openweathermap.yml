openapi: "3.1.1"
info:
  title: "OpenWeatherMap API"
  description: "Get the current weather, daily forecast for 16 days, and a three-hour-interval forecast for 5 days for your city. Helpful stats, graphics, and this day in history charts are available for your reference. Interactive maps show precipitation, clouds, pressure, wind around your location stations. Data is available in JSON, XML, or HTML format. **Note**: This sample Swagger file covers the `current` endpoint only from the OpenWeatherMap API. <br/><br/> **Note**: All parameters are optional, but you must select at least one parameter. OpenWeatherMap recommends calling the API by geographic coordinates (using the `lat` and `lon` parameters)."
  version: "2.5"
  termsOfService: "https://openweathermap.org/terms"
  contact:
    name: "OpenWeatherMap API"
    url: "https://openweathermap.org/api"
    email: "some_email@gmail.com"
  license:
    name: "CC Attribution-ShareAlike 4.0 (CC BY-SA 4.0)"
    url: "https://openweathermap.org/price"

servers:
- url: "https://api.openweathermap.org/data/2.5"

paths:
  /weather:
    get:
      tags:
      - Current Weather Data
      summary: "Call current weather data for one location"
      description: "Access current weather data for any location on Earth including over 200,000 cities! Current weather is frequently updated based on global models and data from more than 40,000 weather stations."
      operationId: CurrentWeatherData
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lon'
        - $ref: '#/components/parameters/zip'
        - $ref: '#/components/parameters/units'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/mode'

      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
        '404':
          description: City not found
          content:
            application/json:
              schema:
                title: Not found
                type: object
                properties:
                  cod:
                    type: string
                    description: HTTP status code, returned as a string
                    examples:
                      - "404"
                  message:
                    type: string
                    description: Error message
                    examples:
                      - "city not found"

security:
- app_id: []

tags:
  - name: Current Weather Data
    description: "Get current weather details"

externalDocs:
  description: API Documentation
  url: https://openweathermap.org/api

components:

  parameters:
    q:
      name: q
      in: query
      description: "**City name**. *Example: London*. You can call by city name, or by city name and country code. For the query value, type the city name and optionally the country code divided by a comma; use ISO 3166 country codes. (OpenWeatherMap has deprecated its built-in geocoding for city names, city IDs, and zip codes. These parameters still work, but OpenWeatherMap recommends using `lat` and `lon` instead.)"
      schema:
        type: string
    id:
      name: id
      in: query
      description: "**City ID**. *Example: `2172797`*. You can call by city ID. The API responds with the exact result. The List of city IDs can be downloaded [here](https://bulk.openweathermap.org/sample/). (OpenWeatherMap has deprecated its built-in geocoding for city names, city IDs, and zip codes. These parameters still work, but OpenWeatherMap recommends using `lat` and `lon` instead.)"
      schema:
        type: string

    lat:
      name: lat
      in: query
      description: "**Latitude**. *Example: 35*. The latitude coordinate of the location of your interest. Must use with `lon`."
      schema:
        type: number

    lon:
      name: lon
      in: query
      description: "**Longitude**. *Example: 139*. Longitude coordinate of the location of your interest. Must use with `lat`."
      schema:
        type: number

    zip:
      name: zip
      in: query
      description: "**Zip code**. Search by zip code. *Example: 95050,us*. Please note that if the country is not specified, the search uses USA as a default. (OpenWeatherMap has deprecated its built-in geocoding for city names, city IDs, and zip codes. These parameters still work, but OpenWeatherMap recommends using `lat` and `lon` instead.)"
      schema:
        type: string

    units:
      name: units
      in: query
      description: '**Units**. *Example: imperial*. Possible values: `standard`, `metric`, and `imperial`. When you do not use the `units` parameter, the format is `standard` by default.'
      schema:
        type: string
        enum: [standard, metric, imperial]
        default: "standard"

    lang:
      name: lang
      in: query
      description: '**Language**. *Example: en*. You can use lang parameter to get the output in your language. We support the following languages that you can use with the corresponded lang values: Arabic - `ar`, Bulgarian - `bg`, Catalan - `ca`, Czech - `cz`, German - `de`, Greek - `el`, English - `en`, Persian (Farsi) - `fa`, Finnish - `fi`, French - `fr`, Galician - `gl`, Croatian - `hr`, Hungarian - `hu`, Italian - `it`, Japanese - `ja`, Korean - `kr`, Latvian - `la`, Lithuanian - `lt`, Macedonian - `mk`, Dutch - `nl`, Polish - `pl`, Portuguese - `pt`, Romanian - `ro`, Russian - `ru`, Swedish - `se`, Slovak - `sk`, Slovenian - `sl`, Spanish - `es`, Turkish - `tr`, Ukrainian - `ua`, Vietnamese - `vi`, Chinese Simplified - `zh_cn`, Chinese Traditional - `zh_tw`.'
      schema:
        type: string
        enum: [ar, bg, ca, cz, de, el, en, fa, fi, fr, gl, hr, hu, it, ja, kr, la, lt, mk, nl, pl, pt, ro, ru, se, sk, sl, es, tr, ua, vi, zh_cn, zh_tw]
        default: "en"

    mode:
      name: mode
      in: query
      description: "**Mode**. *Example: html*. Determines the format of the response. Possible values are `json`, `xml`, and `html`. If the mode parameter is empty, the format is `json` by default."
      schema:
        type: string
        enum: [json, xml, html]
        default: "json"

  schemas:
    SuccessfulResponse:
      title: Successful response
      type: object
      properties:
        coord:
          $ref: '#/components/schemas/Coord'
        weather:
          type: array
          items:
            $ref: '#/components/schemas/Weather'
          description: (more info Weather condition codes)
        base:
          type: string
          description: Internal parameter
          examples:
            - "stations"
        main:
          $ref: '#/components/schemas/Main'
        visibility:
          type: integer
          description: Visibility, meter
          examples:
            - 10000
        wind:
          $ref: '#/components/schemas/Wind'
        clouds:
          $ref: '#/components/schemas/Clouds'
        rain:
          $ref: '#/components/schemas/Rain'
        snow:
          $ref: '#/components/schemas/Snow'
        dt:
          type: integer
          description: Time of data calculation, unix, UTC
          format: int32
          examples:
            - 1485789600
        sys:
          $ref: '#/components/schemas/Sys'
        timezone:
          type: integer
          description: Shift in seconds from UTC
          examples:
            - 36000
        id:
          type: integer
          description: City ID
          format: int32
          examples:
            - 2172797
        name:
          type: string
          examples:
            - "Cairns"
        cod:
          type: integer
          description: Internal parameter
          format: int32
          examples:
            - 200
    Coord:
      title: Coord
      type: object
      properties:
        lon:
          type: number
          description: City geo location, longitude
          examples:
            - 145.77
        lat:
          type: number
          description: City geo location, latitude
          examples:
            - -16.92
    Weather:
      title: Weather
      type: object
      properties:
        id:
          type: integer
          description: Weather condition id
          format: int32
          examples:
            - 803
        main:
          type: string
          description: Group of weather parameters (Rain, Snow, Extreme etc.)
          examples:
            - "Clouds"
        description:
          type: string
          description: Weather condition within the group
          examples:
            - "broken clouds"
        icon:
          type: string
          description: Weather icon id
          examples:
            - "04n"
    Main:
      title: Main
      type: object
      properties:
        temp:
          type: number
          description: 'Temperature. Unit Default: Kelvin, Metric: Celsius, Imperial: Fahrenheit.'
          examples:
            - 293.25
        feels_like:
          type: number
          description: 'Temperature. This temperature parameter accounts for the human perception of weather. Unit Default: Kelvin, Metric: Celsius, Imperial: Fahrenheit.'
          examples:
            - 292.79
        pressure:
          type: integer
          description: Atmospheric pressure (on the sea level, if there is no sea_level or grnd_level data), hPa
          format: int32
          examples:
            - 1019
        humidity:
          type: integer
          description: Humidity, %
          format: int32
          examples:
            - 83
        temp_min:
          type: number
          description: 'Minimum temperature at the moment. This is deviation from current temp that is possible for large cities and megalopolises geographically expanded (use these parameter optionally). Unit Default: Kelvin, Metric: Celsius, Imperial: Fahrenheit.'
          examples:
            - 289.82
        temp_max:
          type: number
          description: 'Maximum temperature at the moment. This is deviation from current temp that is possible for large cities and megalopolises geographically expanded (use these parameter optionally). Unit Default: Kelvin, Metric: Celsius, Imperial: Fahrenheit.'
          examples:
            - 295.37
        sea_level:
          type: number
          description: Atmospheric pressure on the sea level, hPa
          examples:
            - 1019
        grnd_level:
          type: number
          description: Atmospheric pressure on the ground level, hPa
          examples:
            - 1019
    Wind:
      title: Wind
      type: object
      properties:
        speed:
          type: number
          description: 'Wind speed. Unit Default: meter/sec, Metric: meter/sec, Imperial: miles/hour.'
          examples:
            - 5.1
        deg:
          type: integer
          description: Wind direction, degrees (meteorological)
          format: int32
          examples:
            - 150
        gust:
          type: number
          description: 'Wind gust. Unit Default: meter/sec, Metric: meter/sec, Imperial: miles/hour.'
          examples:
            - 7.2
    Clouds:
      title: Clouds
      type: object
      properties:
        all:
          type: integer
          description: Cloudiness, %
          format: int32
          examples:
            - 75
    Rain:
      title: Rain
      type: object
      properties:
        '1h':
          type: number
          description: Rain precipitation for the last hour, mm/h (where available)
          examples:
            - 3
    Snow:
      title: Snow
      type: object
      properties:
        '1h':
          type: number
          description: Snow precipitation for the last hour, mm/h (where available)
          examples:
            - 6
    Sys:
      title: Sys
      type: object
      properties:
        type:
          type: integer
          description: Internal parameter
          format: int32
          examples:
            - 1
        id:
          type: integer
          description: Internal parameter
          format: int32
          examples:
            - 8166
        message:
          type: number
          description: Internal parameter
          examples:
            - 0.0166
        country:
          type: string
          description: Country code (GB, JP etc.)
          examples:
            - "AU"
        sunrise:
          type: integer
          description: Sunrise time, unix, UTC
          format: int32
          examples:
            - 1435610796
        sunset:
          type: integer
          description: Sunset time, unix, UTC
          format: int32
          examples:
            - 1435650870

  securitySchemes:
    app_id:
      type: apiKey
      description: "API key to authorize requests. (If you don't have an API key, get one at https://openweathermap.org/. See https://idratherbewriting.com/learnapidoc/docapis_get_auth_keys.html for details.)"
      name: appid
      in: query

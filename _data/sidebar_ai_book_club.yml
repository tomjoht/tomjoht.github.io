sidebartitle: "AI Book Club"

# One folder on purpose: the sidebar uses an accordion, so a second folder would
# sit collapsed whenever the reader is on a page outside it. Keeping everything
# in one folder means the past discussions are always visible.
folders:

- title: "AI Book Club"
  landing: /ai-book-club/
  section: one
  class: first
  folderitems:

  - title: "About the book club"
    jurl: /ai-book-club/

  - title: "Browse all books"
    jurl: /ai-book-club-books/

  - title: "All book club posts"
    jurl: /category-ai-book-club/

  - title: "Looking back one year in"
    jurl: /blog/looking-at-book-club-one-year-in

  # Past discussions are appended here by _layouts/default.html from the
  # `previous` list in _data/ai_book_club.yml, newest first. Don't add them by
  # hand — adding a session to that file updates this sidebar automatically.
  # Sessions with no recording URL are skipped.
  source: ai_book_club

upcoming:

  - date: "Aug 16, 2026"
    time: "10am PT"
    book:
      title: "The Maniac"
      author: "Benjamin Labatut"
      url: "https://www.amazon.com/dp/0593654498"
      audible_url: "https://www.audible.com/pd/The-Maniac-Audiobook/B0BVNYBQ5D"
      image: "themaniac.jpg"
      summary: >
        "A prodigy whose gifts terrified the people around him, John von Neumann transformed every field he touched, inventing game theory and the first programable computer, and pioneering AI, digital life, and cellular automata. Through a chorus of family members, friends, colleagues, and rivals, Labatut shows us the evolution of a mind unmatched and of a body of work that has unmoored the world in its wake."
    notes_url: "https://docs.google.com/document/d/1J7jUmzaCex2G_2kXn1hpBx9oNdM2K9k2BGRkwoK4MEc/edit?tab=t.0"
    meet_url: "https://meet.google.com/nax-bwut-sja"

  - date: "Sep 20, 2026"
    time: "10am PT"
    book:
      title: "Docs as Tests & AI: A Strategy for Self-Healing Technical Documentation"
      author: "Manny Silva"
      url: "https://www.amazon.com/Docs-Tests-Self-Healing-Technical-Documentation/dp/B0H181C5DQ/"
      image: "manny_silva.png"
      summary: >
        "Docs as Tests & AI picks up where Docs as Tests left off. Manny Silva shows how to validate documentation when AI is generating it, consuming it, or both. The book covers territory the original didn't: the difference between deterministic and probabilistic testing, validating the content that feeds AI systems, writing documentation that gives AI agents reliable process knowledge, and building systems that detect and fix errors automatically."
    notes_url: ""
    meet_url: "https://meet.google.com/nax-bwut-sja"

  - date: "Oct 18, 2026"
    time: "10am PT"
    book:
      title: "Reboot: AI and the Race to Save Democracy"
      author: "Beth Simone Noveck"
      url: "https://www.amazon.com/dp/030027999X"
      audible_url: "https://www.audible.com/pd/Reboot-Audiobook/B0GXGX7FXX"
      image: "reboot_noveck.jpg"
      summary: >
        "Democracy is in retreat at home and abroad. Our institutions and our politics are more broken than ever. At this delicate moment, artificial intelligence has burst onto the scene, a powerful technology that holds as much potential to bolster democracy as to harm it. ... Many warn that AI will accelerate authoritarianism. In <i>Reboot</i>, Beth Simone Noveck makes a different case. Drawing on decades of work building technology and working inside government, from the White House to 10 Downing Street, she shows how democratic institutions can deliberately design, govern, and invest in AI to strengthen democracy rather than undermine it."
    notes_url: ""
    meet_url: "https://meet.google.com/nax-bwut-sja"

  - date: "Nov 15, 2026"
    time: "10am PT"
    book:
      title: "I Am Not a Robot: My Year Using AI to Do (Almost) Everything"
      author: "Joanna Stern"
      url: "https://www.amazon.com/dp/0063446618"
      audible_url: "https://www.audible.com/pd/I-Am-Not-a-Robot-Audiobook/B0FPRNJYV8"
      image: "i-am-robot-book.png"
      summary: >
        "<i>I Am Not a Robot</i> is like a time machine trip to the very near future, where AI promises to be your doctor, chauffeur, teacher, masseuse, coworker, therapist, financial planner, chef, housekeeper, and even . . . romantic partner. Your colleague might be using ChatGPT to write emails at work, but Joanna used AI tools and robots to do household chores, to manage her health, and to transport her family on vacation. If there was a decision to make or a task to do, she let AI go first. Along the way, she conducted exclusive interviews with the tech leaders building this future, then reported back from the front lines as your funny, no-nonsense tour guide."
    notes_url: ""
    meet_url: "https://meet.google.com/nax-bwut-sja"

  - date: "Dec 20, 2026"
    time: "10am PT"
    book:
      title: "The AGI Chronicles: The Inside Story of the Race to Create an Artificial Superintelligence"
      author: "Kevin Roose"
      url: "https://www.amazon.com/dp/0374618755"
      audible_url: "https://www.audible.com/pd/The-AGI-Chronicles-Audiobook/B0GBYLW6CT"
      image: "agi_chronicles.png"
      summary: >
        "For the last decade, a handful of AI companies have been racing to build the most powerful technology in history: artificial general intelligence, or AGI―a computer system capable of outdoing humans at almost anything. Some of them hoped AGI would cure diseases and heal the planet. Others feared it could kill everyone on Earth. They decided to build it anyway."
    notes_url: ""
    meet_url: "https://meet.google.com/nax-bwut-sja"

  - date: "Jan 17, 2027"
    time: "10am PT"
    book:
      title: "Prophecy: Prediction, Power, and the Fight for the Future, from Ancient Oracles to AI"
      author: "Carissa Véliz"
      url: "https://www.amazon.com/Prophecy-Prediction-Future-Ancient-Oracles/dp/0385550979"
      audible_url: "https://www.audible.com/pd/Prophecy-Audiobook/B0FKTRGVRN"
      image: "prophecy_veliz.jpg"
      summary: >
        "<i>Prophecy</i> is about how extensive use of predictive analytics is undermining our abilities to defy the odds, making systems unaccountable, and increasing risk in business and society while creating a false sense of security." Véliz traces prediction's role in power across history &mdash; from the oracle at Delphi through the rise of statistics and insurance to the failures of contemporary AI &mdash; and argues that today's tech executives function much as ancient oracles and astrologers once did. Predictions that claim to be objective turn out to be probabilistic judgments that can become self-fulfilling, shaping who gets a job, a loan, or medical care.
    notes_url: ""
    meet_url: "https://meet.google.com/nax-bwut-sja"

  - date: "Feb 21, 2027"
    time: "10am PT"
    book:
      title: "Culpability: A Novel"
      author: "Bruce Holsinger"
      url: "https://www.amazon.com/Culpability-Novel-Bruce-Holsinger/dp/1954118961"
      audible_url: "https://www.audible.com/pd/Culpability-Audiobook/B0F33VXBQS"
      image: "culpability_holsinger.jpg"
      summary: >
        "When the Cassidy-Shaws' autonomous minivan collides with an oncoming car, seventeen-year-old Charlie is in the driver's seat, with his father, Noah, riding shotgun. In the back seat, tweens Alice and Izzy are on their phones, while their mother, Lorelei, a world leader in the field of artificial intelligence, is absorbed in her work. Yet each family member harbors a secret, implicating them all in the tragic accident. ... [A] propulsive family drama that is also a fascinating exploration of the moral responsibility and ethical consequences of AI."
    notes_url: ""
    meet_url: "https://meet.google.com/nax-bwut-sja"

